name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            apps/api/requirements.txt
            workers/ingestion_worker/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r workers/ingestion_worker/requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run unit tests
        env:
          PYTHONPATH: .:apps/api
        run: pytest tests/unit -q

      - name: Compile Python source
        run: python -m compileall apps/api/app workers/ingestion_worker tests

      - name: Validate Docker Compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.prod.yml config >/dev/null

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_URL: /api
        run: npm run build
