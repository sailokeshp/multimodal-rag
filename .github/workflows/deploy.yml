name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build React frontend ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build frontend
        run: npm run build
        working-directory: apps/web
        env:
          VITE_API_URL: http://${{ secrets.EC2_HOST }}/api

      # ── Write .env from secrets ───────────────────────────────────────────
      - name: Write .env file
        run: |
          cat > .env << 'EOF'
          APP_ENV=production
          API_PORT=8000

          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=multimodal_rag
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

          LOCAL_STORAGE_PATH=/tmp/rag_uploads
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}

          TEXT_EMBED_MODEL_NAME=BAAI/bge-small-en-v1.5
          TEXT_EMBED_DIM=384
          IMAGE_EMBED_MODEL_NAME=google/siglip2-so400m-patch16-384
          IMAGE_EMBED_DIM=1152

          GEN_MODEL_BACKEND=groq
          GEN_MODEL_NAME=gemma2-9b-it
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GOOGLE_AI_API_KEY=
          GOOGLE_AI_MODEL=gemini-2.0-flash
          ENABLE_GROUNDED_ANSWER=true

          USE_LOCAL_OCR=true
          USE_TEXTRACT=false

          TOP_K_TEXT=8
          TOP_K_IMAGE=8
          TOP_K_FINAL=10
          RETRIEVAL_SCORE_THRESHOLD=0.3

          MAX_UPLOAD_MB=50
          MAX_PDF_PAGES=300

          SQS_QUEUE_URL=${{ secrets.SQS_QUEUE_URL }}
          API_KEY=
          EOF

      # ── Deploy to EC2 via SSH ─────────────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to EC2
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='apps/web/node_modules' \
            --exclude='*.pem' \
            ./ ubuntu@${{ secrets.EC2_HOST }}:/opt/rag/

      - name: Upload .env
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            .env ubuntu@${{ secrets.EC2_HOST }}:/opt/rag/.env

      - name: Restart Docker stack
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} "bash -s" << 'REMOTE'
            set -e
            cd /opt/rag
            sudo docker compose -f docker-compose.prod.yml build --quiet
            sudo docker compose -f docker-compose.prod.yml down --remove-orphans
            sudo docker compose -f docker-compose.prod.yml up -d
            echo "Stack restarted successfully"
          REMOTE

      # ── Health check ──────────────────────────────────────────────────────
      - name: Health check
        run: |
          echo "Waiting for API to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 http://${{ secrets.EC2_HOST }}/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 2 minutes"
          exit 1

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "### Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: http://${{ secrets.EC2_HOST }}/" >> $GITHUB_STEP_SUMMARY
          echo "- **API Docs**: http://${{ secrets.EC2_HOST }}/api/docs" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
