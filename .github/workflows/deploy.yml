name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout workflow run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout requested ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Validate required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          SQS_QUEUE_URL: ${{ secrets.SQS_QUEUE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          missing=0
          for name in \
            EC2_HOST \
            EC2_SSH_KEY \
            POSTGRES_PASSWORD \
            AWS_REGION \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            S3_BUCKET \
            SQS_QUEUE_URL \
            GROQ_API_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Capture deployed commit
        run: echo "DEPLOYED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build frontend
        run: npm run build
        working-directory: apps/web
        env:
          VITE_API_URL: http://${{ secrets.EC2_HOST }}/api

      - name: Write EC2 SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > "${RUNNER_TEMP}/stockmind-key.pem"
          chmod 600 "${RUNNER_TEMP}/stockmind-key.pem"

      - name: Write .env.aws
        run: |
          cat > .env.aws << EOF
          AWS_REGION=${{ secrets.AWS_REGION }}
          EC2_PUBLIC_IP=${{ secrets.EC2_HOST }}
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          SQS_QUEUE_URL=${{ secrets.SQS_QUEUE_URL }}
          EOF

      - name: Write .env file
        run: |
          cat > .env << EOF
          APP_ENV=production
          API_PORT=8000
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=multimodal_rag
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          LOCAL_STORAGE_PATH=/tmp/rag_uploads
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TEXT_EMBED_MODEL_NAME=BAAI/bge-small-en-v1.5
          TEXT_EMBED_DIM=384
          ENABLE_TEXT_EMBEDDINGS=true
          IMAGE_EMBED_MODEL_NAME=google/siglip2-so400m-patch16-384
          IMAGE_EMBED_DIM=1152
          ENABLE_IMAGE_EMBEDDINGS=true
          IMAGE_QUERY_EMBED_POLICY=always
          GEN_MODEL_BACKEND=groq
          GEN_MODEL_NAME=llama-3.1-8b-instant
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GOOGLE_AI_API_KEY=${{ secrets.GOOGLE_AI_API_KEY }}
          GOOGLE_AI_MODEL=gemini-2.0-flash
          ENABLE_GROUNDED_ANSWER=true
          USE_LOCAL_OCR=true
          USE_TEXTRACT=false
          TOP_K_TEXT=8
          TOP_K_IMAGE=8
          TOP_K_FINAL=10
          RETRIEVAL_SCORE_THRESHOLD=0.3
          MAX_UPLOAD_MB=50
          MAX_PDF_PAGES=300
          SQS_QUEUE_URL=${{ secrets.SQS_QUEUE_URL }}
          API_KEY=
          EOF

      - name: Deploy to EC2
        env:
          KEY_PATH: ${{ runner.temp }}/stockmind-key.pem
        run: |
          chmod +x ./infra/aws/deploy.sh
          ./infra/aws/deploy.sh --skip-build

      - name: Deployment summary
        if: success()
        run: |
          echo "### Deployment Successful :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: http://${{ secrets.EC2_HOST }}/" >> $GITHUB_STEP_SUMMARY
          echo "- **API Docs**: http://${{ secrets.EC2_HOST }}/api/docs" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ env.DEPLOYED_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
